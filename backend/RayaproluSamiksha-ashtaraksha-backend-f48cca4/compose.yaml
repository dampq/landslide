services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/backend.sqlite3
    volumes: ["backend-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/backend.sqlite3
    volumes: ["backend-data:/data"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
volumes:
  backend-data:
