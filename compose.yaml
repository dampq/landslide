services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ashtaraksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
      POSTGRES_DB: ashtaraksha
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ashtaraksha-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ashtaraksha -d ashtaraksha"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ashtaraksha-postgres:
